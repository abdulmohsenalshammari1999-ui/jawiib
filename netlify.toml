[build]
  command = "vite build"
  publish = "dist/client"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

# ── Security headers for all routes ──────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Force HTTPS for 1 year; include subdomains; eligible for browser preload lists
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Block embedding in any iframe — prevents clickjacking (legacy browsers use X-Frame-Options)
    X-Frame-Options = "DENY"

    # Prevent MIME-type sniffing attacks
    X-Content-Type-Options = "nosniff"

    # Legacy XSS filter — block rather than sanitize on older browsers
    X-XSS-Protection = "1; mode=block"

    # Only send origin on cross-origin requests (no full URL leaked in Referer)
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Disable browser features not used by the app
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), bluetooth=(), interest-cohort=()"

    # Content Security Policy
    # - script-src unsafe-inline required: TanStack Start injects inline hydration scripts
    # - style-src unsafe-inline required: React inline style props
    # - Google Fonts loaded via preconnect links in <head>
    # - frame-ancestors 'none' enforces no-iframe for CSP-aware browsers
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'none'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

# ── Cache immutable hashed assets forever ────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Manifest — short cache ────────────────────────────────────────────────────
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
