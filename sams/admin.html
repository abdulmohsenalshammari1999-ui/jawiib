<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recruiter Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/admin.css">
</head>
<body>
  <div class="admin-page">
    <div class="top-bar">
      <div class="top-bar-info">
        <img id="org-logo" src="" alt="">
        <div>
          <h2 id="vacancy-title"></h2>
          <div class="top-bar-meta">Total applicants: <span id="applicant-count">0</span> · Last synced: <span id="last-synced">never</span></div>
        </div>
      </div>
      <button class="btn btn-primary" id="sync-btn"><i class="fa-solid fa-rotate"></i> Sync</button>
    </div>

    <div class="card filter-bar">
      <div class="filter-row">
        <div class="filter-group">
          <label>Score Min</label>
          <input type="number" id="f-score-min" min="0" max="100">
        </div>
        <div class="filter-group">
          <label>Score Max</label>
          <input type="number" id="f-score-max" min="0" max="100">
        </div>
        <div class="filter-group">
          <label>Min Experience (yrs)</label>
          <input type="number" id="f-min-exp" min="0">
        </div>
        <div class="filter-group">
          <label>Status</label>
          <select id="f-status">
            <option value="">All</option>
            <option value="Shortlist">Shortlist</option>
            <option value="Hold">Hold</option>
            <option value="Reject">Reject</option>
            <option value="Pending">Pending</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Nationality</label>
          <select id="f-nationality"><option value="">All</option></select>
        </div>
        <div class="filter-group">
          <label>Relocate</label>
          <select id="f-relocate">
            <option value="">Any</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
            <option value="Negotiable">Negotiable</option>
          </select>
        </div>
        <div class="filter-group" style="flex:2">
          <label>Keyword Search</label>
          <input type="text" id="f-keyword" placeholder="Name, email, domain, country...">
        </div>
      </div>
      <div class="filter-actions">
        <button class="btn btn-primary" id="apply-filters">Apply Filters</button>
        <button class="btn" id="reset-filters">Reset</button>
        <button class="btn btn-accent" id="export-btn"><i class="fa-solid fa-file-excel"></i> Export to Excel</button>
      </div>
    </div>

    <div class="card table-wrap">
      <table id="applicants-table">
        <thead>
          <tr>
            <th data-sort="rank">Rank</th>
            <th data-sort="App_ID">App ID</th>
            <th data-sort="Full_Name">Full Name</th>
            <th data-sort="Nationality">Nationality</th>
            <th data-sort="Country_Residing">Country Residing</th>
            <th data-sort="Total_Years_Exp">Total Exp</th>
            <th data-sort="Domain_Years_Exp">Domain Exp</th>
            <th data-sort="TOTAL_SCORE">Score</th>
            <th data-sort="Score_Band">Band</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="applicants-tbody"></tbody>
      </table>
    </div>

    <div class="card" id="summary-stats"></div>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="config.js"></script>
  <script src="scripts/scoring.js"></script>
  <script src="scripts/sheets.js"></script>
  <script src="scripts/admin.js"></script>
</body>
</html>
